<svg xmlns="http://www.w3.org/2000/svg" width="824" height="754" viewBox="0 0 824 754" role="img" aria-label="Kripke structure of the two-process mutual exclusion example: nine states drawn as circles labelled with the propositions holding in them, with the state in which both processes are critical unreachable">
