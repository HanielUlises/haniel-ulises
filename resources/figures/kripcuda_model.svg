<circle cx="384" cy="346" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="384" y="342" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">wait, wait</text><text x="384" y="361" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{ }</text>
<circle cx="592" cy="346" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="592" y="342" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">wait, crit</text><text x="592" y="361" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{crit1}</text>
<circle cx="176" cy="524" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="176" y="520" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">crit, idle</text><text x="176" y="539" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{crit0}</text>
<circle cx="384" cy="524" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="384" y="520" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">crit, wait</text><text x="384" y="539" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{crit0}</text>
<circle cx="592" cy="524" r="52" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="592" y="520" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">crit, crit</text><text x="592" y="539" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{crit0, crit1}</text>
<text x="124" y="680" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="12.5">Vertical arrows move process 0, horizontal arrows move process 1; a self loop is a blocked move.</text>
<text x="124" y="700" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="12.5">Every state has a successor, so R is total and the branching-time semantics are defined on every path.</text>
<text x="124" y="720" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="12.5">Dashed: (crit, crit) has no incoming transition, so AG ¬(crit0 ∧ crit1) holds on the reachable fragment.</text>
</svg>
