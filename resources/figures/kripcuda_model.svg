<text x="124" y="44" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">M = (S, S₀, R, L) over AP = {crit0, crit1}; a state is the pair (pc₀, pc₁)</text>
