<circle cx="176" cy="168" r="57" fill="none" stroke="#111111" stroke-width="1"/><circle cx="176" cy="168" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="176" y="164" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">idle, idle</text><text x="176" y="183" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{ }</text>
<circle cx="384" cy="168" r="52" fill="#ffffff" stroke="#111111" stroke-width="1.3"/><text x="384" y="164" text-anchor="middle" fill="#111111" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13">idle, wait</text><text x="384" y="183" text-anchor="middle" fill="#8f8f8f" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11.5" font-style="italic">{ }</text>
